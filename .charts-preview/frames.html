<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Member Charts · responsive frames</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        background: #f4f4f5;
        font: 12px/1.5 ui-sans-serif, system-ui, sans-serif;
        color: #3f3f46;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 4px;
      }
      p.note {
        margin: 0 0 16px;
        color: #71717a;
      }
      section {
        margin-bottom: 22px;
      }
      h2 {
        margin: 0 0 6px;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .frame-wrap {
        display: inline-block;
        max-width: 100%;
        overflow: hidden;
        border: 1px solid #d4d4d8;
        background: #fff;
        vertical-align: top;
      }
      iframe {
        display: block;
        border: 0;
        transform-origin: top left;
      }
    </style>
  </head>
  <body>
    <h1>Member Charts · responsive check</h1>
    <p class="note">Real components with mock payout data. Laptop frames scaled 50%.</p>

    <section>
      <h2>320 × 1100</h2>
      <div class="frame-wrap">
        <iframe data-w="320" data-h="1100" src="/?frame=320" title="320"></iframe>
      </div>
    </section>
    <section>
      <h2>375 × 1100</h2>
      <div class="frame-wrap">
        <iframe data-w="375" data-h="1100" src="/?frame=375" title="375"></iframe>
      </div>
    </section>
    <section>
      <h2>390 × 1200</h2>
      <div class="frame-wrap">
        <iframe data-w="390" data-h="1200" src="/?frame=390" title="390"></iframe>
      </div>
    </section>
    <section>
      <h2>430 × 1200</h2>
      <div class="frame-wrap">
        <iframe data-w="430" data-h="1200" src="/?frame=430" title="430"></iframe>
      </div>
    </section>
    <section>
      <h2>1366 × 900</h2>
      <div class="frame-wrap" style="height: 450px">
        <iframe
          data-w="1366"
          data-h="900"
          data-scale="0.5"
          src="/?frame=1366"
          title="1366"
          style="transform: scale(0.5)"
        ></iframe>
      </div>
    </section>
    <section>
      <h2>1440 × 900</h2>
      <div class="frame-wrap" style="height: 450px">
        <iframe
          data-w="1440"
          data-h="900"
          data-scale="0.5"
          src="/?frame=1440"
          title="1440"
          style="transform: scale(0.5)"
        ></iframe>
      </div>
    </section>

    <script>
      for (const frame of document.querySelectorAll('iframe[data-w]')) {
        frame.style.width = frame.dataset.w + 'px'
        frame.style.height = frame.dataset.h + 'px'
      }
    </script>
  </body>
</html>

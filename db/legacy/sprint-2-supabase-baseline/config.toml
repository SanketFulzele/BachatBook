# ============================================================================
# Bachify · Supabase local development configuration
# ----------------------------------------------------------------------------
# Used by the Supabase CLI (`supabase start`, `supabase db reset`).
# `project_id` is local-only; it is not the hosted project reference.
#
# Secrets for local development are the CLI defaults and must never be copied
# into a hosted project. Hosted credentials belong in .env (git-ignored).
# ============================================================================

project_id = "bachify"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/reset-password"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enabled = true
double_confirm_changes = true
enable_confirmations = false

[auth.external.apple]
enabled = false

[storage]
enabled = true
file_size_limit = "50MiB"

[analytics]
enabled = false
